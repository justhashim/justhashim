<!-- Typing banner: reveals once on load, then holds. Text stays legible if SMIL is off. -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 620 112'
    style='background-color: #00000000;'
    width='620px' height='112px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='2500ms' fill="freeze"
                    values='m0,29 h0 ; m0,29 h0 ; m0,29 h620 ; m0,29 h620' keyTimes='0;0;1;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#0969da' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Backend developer
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s'
                    dur='5000ms' fill="freeze"
                    values='m0,58 h0 ; m0,58 h0 ; m0,58 h620 ; m0,58 h620' keyTimes='0;0.5;1;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#0969da' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Java / Spring Boot / Node
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Multiline -->
                                <animate id='d2' attributeName='d' begin='0s'
                    dur='7500ms' fill="freeze"
                    values='m0,87 h0 ; m0,87 h0 ; m0,87 h620 ; m0,87 h620' keyTimes='0;0.66666666666667;1;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#0969da' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            React / Next.js / Tailwind
        </textPath>
    </text>
</svg>
