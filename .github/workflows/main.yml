name: Contribution snake

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour to avoid the GitHub rush

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          # read the contribution graph from the repo owner
          github_user_name: ${{ github.repository_owner }}

          # one output per line, each configurable with query-string options:
          # - palette:     [github, github-dark, github-light]
          # - color_snake: colour of the snake
          # - color_dots:  exactly 5 comma-separated colours, lowest to highest
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Publish to the output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          # keep the previously generated assets that are not in dist/
          clean: false
          single-commit: true
          commit-message: "chore: update contribution snake"