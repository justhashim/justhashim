name: Latest Medium posts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *" # daily, 07:53 IST

permissions:
  contents: write

concurrency:
  group: medium
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pull the latest posts into the README
        run: python3 .github/scripts/medium.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet README.md; then
            echo "Nothing new on Medium."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update latest Medium posts"
          git push
